<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG card source — screenshot at 1200x630 to regenerate og.png</title>
<link rel="stylesheet" href="gloam.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    background:radial-gradient(1100px 520px at 78% 18%, color-mix(in srgb, var(--gl-accent) 16%, transparent), transparent 62%), var(--gl-bg);}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:74px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px;font:700 30px/1 var(--gl-sans);color:var(--gl-fg)}
  h1{font:800 76px/1.04 var(--gl-sans);margin:0;letter-spacing:-.025em;color:var(--gl-fg);max-width:15ch}
  h1 .g{background:linear-gradient(92deg,var(--gl-accent),#d2b3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font:400 27px/1.5 var(--gl-sans);color:var(--gl-muted);margin:22px 0 0;max-width:30ch}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .pills{display:flex;flex-wrap:wrap;gap:9px;max-width:640px}
  .pill{font:600 18px/1 var(--gl-mono);color:var(--gl-accent-2);background:color-mix(in srgb,var(--gl-accent) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--gl-accent) 32%,transparent);border-radius:999px;padding:9px 15px}
  .host{font:600 24px/1 var(--gl-mono);color:var(--gl-faint);white-space:nowrap}
</style></head>
<body class="gl"><div class="card">
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="var(--gl-panel-2)"/>
      <rect x="5" y="12" width="3.5" height="7" rx="1" fill="var(--gl-accent)"/>
      <rect x="10.25" y="8" width="3.5" height="11" rx="1" fill="var(--gl-accent-2)"/>
      <rect x="15.5" y="4" width="3.5" height="15" rx="1" fill="#d2b3ff"/></svg>
    C2PA Inspector
  </div>
  <div>
    <h1>Who made this file, <span class="g">and has it changed?</span></h1>
    <p>Full Content Credentials validation — in your browser. Nothing is uploaded.</p>
  </div>
  <div class="row">
    <div class="pills">
      <span class="pill">JPEG</span><span class="pill">PNG</span><span class="pill">WebP</span>
      <span class="pill">GIF</span><span class="pill">TIFF</span><span class="pill">HEIC</span>
      <span class="pill">AVIF</span><span class="pill">SVG</span><span class="pill">MP4</span>
      <span class="pill">MOV</span><span class="pill">AVI</span><span class="pill">WAV</span>
      <span class="pill">MP3</span><span class="pill">PDF</span>
    </div>
    <div class="host">c2pa-inspector.dev</div>
  </div>
</div></body></html>
