name: Release

# The site ships on every push to main (deploy.yml); a tag is the version
# record — what was deployed at that point, and which c2pa release its WASM
# was built against.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o c2pa.wasm ./wasm

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine=$(go list -m -f '{{.Version}}' github.com/richardwooding/c2pa)
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          {
            echo "Built against [c2pa ${engine}](https://github.com/richardwooding/c2pa/releases/tag/${engine})."
            echo
            echo "Live at <https://richardwooding.github.io/c2pa-inspector/>. The attached \`c2pa.wasm\` is the validator this release deployed."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME} — c2pa ${engine}" \
            --notes-file notes.md \
            c2pa.wasm
